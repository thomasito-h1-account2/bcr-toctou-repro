name: review_prs

on:
  workflow_dispatch: {}   # manually fired by us to simulate the real 20-min cron tick at the exact moment we want to test

jobs:
  review_prs:
    runs-on: ubuntu-latest
    steps:
      - uses: bazelbuild/continuous-integration/actions/bcr-pr-reviewer@03ac5c92f885acca076c0f4e3b4cf0cf79e867c4 # master, real BCR action, unmodified
        with:
          token: ${{ secrets.MAINTAINER_TOKEN }}
          action-type: review_prs
